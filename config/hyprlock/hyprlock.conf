# ============================================================================
# Hyprlock Configuration — Ultra-Premium Tokyo Night Lock Screen
# A minimal, elegant, high-end lock screen with glassmorphic depth,
# massive clock, circular avatar, and refined input field.
# Author: CyberSnake
# Date:   2026-03-26
#
# Layout (centered vertical stack):
#   Avatar  ->  Clock  ->  Date  ->  Greeting  ->  Input  ->  Status
#
# Palette (Tokyo Night Storm):
#   #1a1b26  #16161e  #1f2335  #24283b  #292e42  #414868
#   #c0caf5  #a9b1d6  #565f89
#   #7aa2f7  #bb9af7  #7dcfff  #9ece6a  #f7768e  #e0af68
# ============================================================================


# ---------------------------------------------------------------------------
# General behavior
# ---------------------------------------------------------------------------
general {
    disable_loading_bar = false
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = true
    immediate_render = true
    pam_module = hyprlock
}


# ---------------------------------------------------------------------------
# Background — heavy blur + darkened wallpaper for cinematic depth
# The wallpaper is softened into a dreamy backdrop so UI elements pop.
# ---------------------------------------------------------------------------
background {
    monitor =
    path = ~/Pictures/Wallpapers/wallpaper.png
    blur_size = 10
    blur_passes = 4
    noise = 0.008
    contrast = 0.85
    brightness = 0.65
    vibrancy = 0.12
    vibrancy_darkness = 0.0
}


# ---------------------------------------------------------------------------
# User avatar — circular, blue-glow border, positioned above clock
# Uses AccountsService icon (GNOME/GDM standard) as the source.
# rounding = -1 forces a perfect circle regardless of image dimensions.
# ---------------------------------------------------------------------------
image {
    monitor =
    path = /var/lib/AccountsService/icons/$USER
    size = 120
    rounding = -1
    border_size = 3
    border_color = rgba(122, 162, 247, 1.0)
    position = 0, 250
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(122, 162, 247, 0.25)
    shadow_boost = 0.8
}


# ---------------------------------------------------------------------------
# Clock — MASSIVE 128px, thin weight, ethereal text shadow
# The clock is the visual anchor of the lock screen. Using a thin
# font weight creates an elegant, modern feel. Seconds included
# for a living, breathing display.
# ---------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(192, 202, 245, 1.0)
    font_size = 128
    font_family = JetBrainsMono Nerd Font Mono ExtraLight
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
    shadow_boost = 0.6
}

# -- Seconds — smaller, faded, tucked beside the clock for subtlety -- #
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%S")"
    color = rgba(122, 162, 247, 0.5)
    font_size = 36
    font_family = JetBrainsMono Nerd Font Mono Light
    position = 200, 60
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.3)
    shadow_boost = 0.3
}


# ---------------------------------------------------------------------------
# Date — elegant, blue accent, smaller than clock for clear hierarchy
# Full weekday name and month for a polished, informative display.
# ---------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(122, 162, 247, 0.95)
    font_size = 24
    font_family = JetBrainsMono Nerd Font Light
    position = 0, 20
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.3)
    shadow_boost = 0.3
}


# ---------------------------------------------------------------------------
# Greeting — warm, personal, muted tone
# $USER is resolved by the shell, creating a personalized welcome.
# ---------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:3600000] echo "Welcome back, $USER"
    color = rgba(169, 177, 214, 0.7)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Light Italic
    position = 0, -30
    halign = center
    valign = center
    shadow_passes = 0
}


# ---------------------------------------------------------------------------
# Password input field — wide, rounded, refined
# Dark inner fill with blue outline on focus. Dots are centered and
# generously spaced for readability. The placeholder text uses a
# blue tint to match the accent color.
# ---------------------------------------------------------------------------
input-field {
    monitor =
    size = 350, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(41, 46, 66, 0.8)
    inner_color = rgba(22, 23, 34, 0.85)
    font_color = rgba(192, 202, 245, 1.0)
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <span foreground="##7aa2f7" font_style="italic">    Enter password...</span>
    hide_input = false
    rounding = 16
    check_color = rgba(122, 162, 247, 1.0)
    fail_color = rgba(247, 118, 142, 1.0)
    fail_text = <span foreground="##f7768e" font_style="italic">  Authentication failed</span>
    fail_transition = 200
    capslock_color = rgba(224, 175, 104, 1.0)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -130
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
    shadow_boost = 0.4
}


# ---------------------------------------------------------------------------
# Lock icon — minimal visual cue above the input field
# ---------------------------------------------------------------------------
label {
    monitor =
    text =
    color = rgba(86, 95, 137, 0.6)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -80
    halign = center
    valign = center
    shadow_passes = 0
}


# ---------------------------------------------------------------------------
# Status bar — volume, battery, keyboard layout, timezone
# Very subtle, positioned at the bottom of the vertical stack.
# All values are polled every 5 seconds for freshness.
# ---------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:5000] echo "  $(pamixer --get-volume 2>/dev/null || echo '--')%   $(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null && echo '%' || echo '')   $(date +"%Z")"
    color = rgba(86, 95, 137, 0.55)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -230
    halign = center
    valign = center
    shadow_passes = 0
}


# ---------------------------------------------------------------------------
# Decorative accent line — thin gradient separator above status
# A subtle visual break between interactive elements and info bar.
# ---------------------------------------------------------------------------
shape {
    monitor =
    size = 200, 2
    color = rgba(122, 162, 247, 0.15)
    rounding = 1
    position = 0, -190
    halign = center
    valign = center
    shadow_passes = 0
}


# ---------------------------------------------------------------------------
# Subtle watermark — bottom corner branding
# Unobtrusive, fades into the background.
# ---------------------------------------------------------------------------
label {
    monitor =
    text = Hyprland
    color = rgba(86, 95, 137, 0.2)
    font_size = 11
    font_family = JetBrainsMono Nerd Font Light
    position = 20, 20
    halign = left
    valign = bottom
    shadow_passes = 0
}
