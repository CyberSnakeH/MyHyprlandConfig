# ║   Date:   2026-03-26                                                ║
# ║                                                                      ║
# ║   exec-once = runs at first launch only.                            ║
# ║   exec = runs every time config is reloaded (avoid for daemons).    ║
# ╚══════════════════════════════════════════════════════════════════════╝


# ─── XDG Desktop Portal ─────────────────────────────────────────────
# Must start before GUI apps that depend on portals (file pickers, etc.)
exec-once = ~/.config/hypr/scripts/portal.sh

# ─── Status Bar ──────────────────────────────────────────────────────
exec-once = waybar

# ─── Wallpaper Daemon (awww) ────────────────────────────────────────
# awww-daemon handles smooth wallpaper transitions; initial wallpaper
# is applied by the wallpaper script after the daemon is ready.
exec-once = awww-daemon
exec-once = sleep 1 && ~/.config/hypr/scripts/wallpaper.sh

# ─── Notification Daemon (SwayNC) ───────────────────────────────────
exec-once = swaync

# ─── Idle Manager ───────────────────────────────────────────────────
exec-once = hypridle

# ─── Authentication Agent ───────────────────────────────────────────
# Try multiple polkit agent paths (Fedora ships different versions)
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1 || /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || /usr/lib/polkit-kde-authentication-agent-1

# ─── Clipboard Manager ──────────────────────────────────────────────
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ─── System Tray Applets ────────────────────────────────────────────
exec-once = nm-applet --indicator
exec-once = blueman-applet
