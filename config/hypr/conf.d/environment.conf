# ─── Wayland / XDG Session ───────────────────────────────────────────
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# ─── Cursor ──────────────────────────────────────────────────────────
env = XCURSOR_THEME, Bibata-Modern-Classic
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_THEME, Bibata-Modern-Classic
env = HYPRCURSOR_SIZE, 24

# ─── Qt Toolkit ──────────────────────────────────────────────────────
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1

# ─── GTK Toolkit ─────────────────────────────────────────────────────
env = GDK_BACKEND, wayland,x11
env = GTK_THEME, Tokyonight-Dark-BL

# ─── Application Backends ────────────────────────────────────────────
env = SDL_VIDEODRIVER, wayland
env = CLUTTER_BACKEND, wayland
env = MOZ_ENABLE_WAYLAND, 1
env = ELECTRON_OZONE_PLATFORM_HINT, wayland


# ══════════════════════════════════════════════════════════════════════
# CORE LAYOUT & BEHAVIOR
# ══════════════════════════════════════════════════════════════════════

# ─── General ─────────────────────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    # Tokyo Night rotating gradient: blue -> purple -> cyan
    # Combined with borderangle loop animation, this creates a continuously
    # rotating prismatic border on active windows
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) rgba(7dcfffee) 45deg
    col.inactive_border = rgba(292e4266)

    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

# ─── Dwindle Layout ─────────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = true
    smart_resizing = true
}

# ─── Master Layout ──────────────────────────────────────────────────
master {
    mfact = 0.55
}

# ─── Miscellaneous ──────────────────────────────────────────────────
misc {
    # Disable default branding
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0

    # Rendering performance
    vfr = true
    vrr = 0

    # Smooth resize & drag animations
    animate_manual_resizes = true
    animate_mouse_windowdragging = true

    # Wake from DPMS on input
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true

    # Terminal swallowing (kitty / alacritty)
    enable_swallow = true
    swallow_regex = ^(kitty|Alacritty)$

    # Prevent focus stealing from urgent windows
    focus_on_activate = false
}
