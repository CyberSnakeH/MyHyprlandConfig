input {
    # Keyboard — French AZERTY layout
    kb_layout = fr
    kb_variant = azerty
    kb_model =
    kb_options =
    kb_rules =

    numlock_by_default = true
    follow_mouse = 1
    mouse_refocus = false

    # Mouse — flat profile for precision, no acceleration
    sensitivity = 0.0
    accel_profile = flat

    # Touchpad (laptop support)
    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
    }
}

# Per-device overrides can be added here:
# device {
#     name = epic-mouse-v1
#     sensitivity = -0.5
# }
