# ══════════════════════════════════════════════════════════════════════
# FLOAT RULES
# ══════════════════════════════════════════════════════════════════════

# System utilities
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(.blueman-manager-wrapped)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(file-roller)$

# Media viewers
windowrulev2 = float, class:^(imv)$
windowrulev2 = float, class:^(mpv)$

# Hyprland tools
windowrulev2 = float, class:^(hyprpicker)$

# Session management
windowrulev2 = float, class:^(wlogout)$

# Generic dialog/preferences windows
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = float, title:^(Preferences)$
windowrulev2 = float, title:(Param)


# ══════════════════════════════════════════════════════════════════════
# FLOAT SIZE & POSITION
# ══════════════════════════════════════════════════════════════════════

# pavucontrol — centered, comfortable size
windowrulev2 = size 900 600, class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$

# blueman — centered
windowrulev2 = size 900 650, class:^(.blueman-manager-wrapped)$
windowrulev2 = center, class:^(.blueman-manager-wrapped)$
windowrulev2 = size 900 650, class:^(blueman-manager)$
windowrulev2 = center, class:^(blueman-manager)$

# mpv — large centered window
windowrulev2 = size 1200 800, class:^(mpv)$
windowrulev2 = center, class:^(mpv)$


# ══════════════════════════════════════════════════════════════════════
# OPACITY OVERRIDES
# ══════════════════════════════════════════════════════════════════════

# Terminals — slight transparency for a layered look
windowrulev2 = opacity 0.90 0.85, class:^(kitty)$

# File manager — nearly opaque
windowrulev2 = opacity 0.95 0.90, class:^(thunar)$

# Code editors — minimal transparency to preserve readability
windowrulev2 = opacity 0.96 0.92, class:^(code)$
windowrulev2 = opacity 0.96 0.92, class:^(codium)$
windowrulev2 = opacity 0.96 0.92, class:^(Code)$
windowrulev2 = opacity 0.96 0.92, class:^(VSCodium)$


# ══════════════════════════════════════════════════════════════════════
# WORKSPACE ASSIGNMENTS
# ══════════════════════════════════════════════════════════════════════

# Browsers on workspace 2
windowrulev2 = workspace 2, class:^(firefox)$
windowrulev2 = workspace 2, class:^(Firefox)$

# Code editors on workspace 3
windowrulev2 = workspace 3, class:^(code)$
windowrulev2 = workspace 3, class:^(codium)$
windowrulev2 = workspace 3, class:^(Code)$
windowrulev2 = workspace 3, class:^(VSCodium)$

# File manager on workspace 5
windowrulev2 = workspace 5, class:^(thunar)$

# Communication on workspace 8
windowrulev2 = workspace 8, class:^(discord)$
windowrulev2 = workspace 8, class:^(vesktop)$
windowrulev2 = workspace 8, class:^(WebCord)$

# Music on workspace 9
windowrulev2 = workspace 9, class:^(Spotify)$
windowrulev2 = workspace 9, title:^(Spotify)$


# ══════════════════════════════════════════════════════════════════════
# SCRATCHPAD — DROPDOWN TERMINAL
# ══════════════════════════════════════════════════════════════════════

# Scratchpad terminal (launched with: kitty --class kittyspecial)
windowrulev2 = float, class:^(kittyspecial)$
windowrulev2 = size 1100 650, class:^(kittyspecial)$
windowrulev2 = center, class:^(kittyspecial)$
windowrulev2 = opacity 0.92 0.92, class:^(kittyspecial)$
windowrulev2 = animation slide, class:^(kittyspecial)$


# ══════════════════════════════════════════════════════════════════════
# ROFI — OPACITY & FOCUS OVERRIDE
# ══════════════════════════════════════════════════════════════════════

# Rofi manages its own transparency via its theme — prevent Hyprland
# from applying additional opacity, and lock focus to the launcher
windowrulev2 = opacity 1.0 override 1.0 override, class:^(Rofi)$
windowrulev2 = stayfocused, class:^(Rofi)$

# Dim everything behind Rofi for visual hierarchy and depth
windowrulev2 = dimaround, class:^(Rofi)$


# ══════════════════════════════════════════════════════════════════════
# LAYER RULES — ROFI, NOTIFICATIONS, OVERLAYS
# ══════════════════════════════════════════════════════════════════════

# Waybar — glassmorphic blur
layerrule = blur, waybar
layerrule = blurpopups, waybar
layerrule = ignorezero, waybar

# Rofi launcher
layerrule = blur, rofi
layerrule = ignorezero, rofi

# SwayNC notification panel
layerrule = blur, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignorezero, swaync-control-center
layerrule = ignorezero, swaync-notification-window
layerrule = ignorealpha 0.5, swaync-notification-window


# ══════════════════════════════════════════════════════════════════════
# TEARING — GAME SUPPORT
# ══════════════════════════════════════════════════════════════════════

# Allow tearing for Steam games (reduces input latency)
windowrulev2 = immediate, class:^(steam_app_.*)$


# ══════════════════════════════════════════════════════════════════════
# SPECIAL WORKSPACES (named scratchpads)
# ══════════════════════════════════════════════════════════════════════

# These are toggled via keybinds in keybinds.conf:
#   SUPER + ` (grave) -> special:terminal
#   SUPER + M          -> special:music
