# ══════════════════════════════════════════════════════════════════════
# FLOAT RULES
# ══════════════════════════════════════════════════════════════════════

# System utilities
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(.blueman-manager-wrapped)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(file-roller)$

# Media viewers
windowrule = float on, match:class ^(imv)$
windowrule = float on, match:class ^(mpv)$

# Hyprland tools
windowrule = float on, match:class ^(hyprpicker)$

# Session management
windowrule = float on, match:class ^(wlogout)$

# Generic dialog/preferences windows
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = float on, match:title ^(Preferences)$
windowrule = float on, match:title (Param)


# ══════════════════════════════════════════════════════════════════════
# FLOAT SIZE & POSITION
# ══════════════════════════════════════════════════════════════════════

# pavucontrol — centered, comfortable size
windowrule = size 900 600, match:class ^(pavucontrol)$
windowrule = center on, match:class ^(pavucontrol)$

# blueman — centered
windowrule = size 900 650, match:class ^(.blueman-manager-wrapped)$
windowrule = center on, match:class ^(.blueman-manager-wrapped)$
windowrule = size 900 650, match:class ^(blueman-manager)$
windowrule = center on, match:class ^(blueman-manager)$

# mpv — large centered window
windowrule = size 1200 800, match:class ^(mpv)$
windowrule = center on, match:class ^(mpv)$


# ══════════════════════════════════════════════════════════════════════
# OPACITY OVERRIDES
# ══════════════════════════════════════════════════════════════════════

# Terminals — slight transparency for a layered look
windowrule = opacity 0.90 0.85, match:class ^(kitty)$

# File manager — nearly opaque
windowrule = opacity 0.95 0.90, match:class ^(thunar)$

# Code editors — minimal transparency to preserve readability
windowrule = opacity 0.96 0.92, match:class ^(code)$
windowrule = opacity 0.96 0.92, match:class ^(codium)$
windowrule = opacity 0.96 0.92, match:class ^(Code)$
windowrule = opacity 0.96 0.92, match:class ^(VSCodium)$


# ══════════════════════════════════════════════════════════════════════
# WORKSPACE ASSIGNMENTS
# ══════════════════════════════════════════════════════════════════════

# Browsers on workspace 2
windowrule = workspace 2, match:class ^(firefox)$
windowrule = workspace 2, match:class ^(Firefox)$

# Code editors on workspace 3
windowrule = workspace 3, match:class ^(code)$
windowrule = workspace 3, match:class ^(codium)$
windowrule = workspace 3, match:class ^(Code)$
windowrule = workspace 3, match:class ^(VSCodium)$

# File manager on workspace 5
windowrule = workspace 5, match:class ^(thunar)$

# Communication on workspace 8
windowrule = workspace 8, match:class ^(discord)$
windowrule = workspace 8, match:class ^(vesktop)$
windowrule = workspace 8, match:class ^(WebCord)$

# Music on workspace 9
windowrule = workspace 9, match:class ^(Spotify)$
windowrule = workspace 9, match:title ^(Spotify)$


# ══════════════════════════════════════════════════════════════════════
# SCRATCHPAD — DROPDOWN TERMINAL
# ══════════════════════════════════════════════════════════════════════

# Scratchpad terminal (launched with: kitty --class kittyspecial)
windowrule = float on, match:class ^(kittyspecial)$
windowrule = size 1100 650, match:class ^(kittyspecial)$
windowrule = center on, match:class ^(kittyspecial)$
windowrule = opacity 0.92 0.92, match:class ^(kittyspecial)$
windowrule = animation slide, match:class ^(kittyspecial)$


# ══════════════════════════════════════════════════════════════════════
# ROFI — OPACITY & FOCUS OVERRIDE
# ══════════════════════════════════════════════════════════════════════

# Rofi manages its own transparency via its theme — prevent Hyprland
# from applying additional opacity, and lock focus to the launcher
windowrule = opacity 1.0 override 1.0 override, match:class ^(Rofi)$
windowrule = stay_focused on, match:class ^(Rofi)$

# Dim everything behind Rofi for visual hierarchy and depth
windowrule = dim_around on, match:class ^(Rofi)$


# ══════════════════════════════════════════════════════════════════════
# LAYER RULES — ROFI, NOTIFICATIONS, OVERLAYS
# ══════════════════════════════════════════════════════════════════════

# Waybar — glassmorphic blur
layerrule = blur on, match:namespace ^(waybar)$
layerrule = blur_popups on, match:namespace ^(waybar)$
layerrule = ignore_alpha 0, match:namespace ^(waybar)$

# Rofi launcher
layerrule = blur on, match:namespace ^(rofi)$
layerrule = ignore_alpha 0, match:namespace ^(rofi)$

# SwayNC notification panel
layerrule = blur on, match:namespace ^(swaync-control-center)$
layerrule = blur on, match:namespace ^(swaync-notification-window)$
layerrule = ignore_alpha 0, match:namespace ^(swaync-control-center)$
layerrule = ignore_alpha 0.5, match:namespace ^(swaync-notification-window)$


# ══════════════════════════════════════════════════════════════════════
# TEARING — GAME SUPPORT
# ══════════════════════════════════════════════════════════════════════

# Allow tearing for Steam games (reduces input latency)
windowrule = immediate on, match:class ^(steam_app_.*)$


# ══════════════════════════════════════════════════════════════════════
# SPECIAL WORKSPACES (named scratchpads)
# ══════════════════════════════════════════════════════════════════════

# These are toggled via keybinds in keybinds.conf:
#   SUPER + ` (grave) -> special:terminal
#   SUPER + M          -> special:music
