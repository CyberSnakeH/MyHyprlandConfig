# ╔══════════════════════════════════════════════════════════════════════╗
# ║   KEYBINDINGS                                                       ║
# ║   Tokyo Night Rice — Hyprland                                       ║
# ║   Author: CyberSnake                                                      ║
# ║   Date:   2026-03-26                                                ║
# ║                                                                      ║
# ║   $mainMod = SUPER. AZERTY-aware layout.                           ║
# ║   Launcher: Rofi · Clipboard: cliphist + Rofi                      ║
# ╚══════════════════════════════════════════════════════════════════════╝


# ─── Mod Key ─────────────────────────────────────────────────────────
$mainMod = SUPER

# ─── Program Shortcuts ──────────────────────────────────────────────
$terminal   = kitty
$browser    = firefox
$filemanager = thunar
$menu       = rofi -show drun -theme ~/.config/rofi/themes/tokyo-night.rasi
$wallpaper  = ~/.config/hypr/scripts/wallpaper.sh


# ══════════════════════════════════════════════════════════════════════
# APPLICATION LAUNCHES
# ══════════════════════════════════════════════════════════════════════

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, E, exec, $filemanager
bind = $mainMod, D, exec, $menu
bind = $mainMod, W, exec, $wallpaper
bind = $mainMod, period, exec, rofi -show emoji -theme ~/.config/rofi/themes/tokyo-night.rasi
bind = $mainMod, T, exec, ~/.config/hypr/scripts/theme-switch.sh menu
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper-picker.sh
bind = $mainMod, O, exec, ~/.config/hypr/scripts/opacity.sh
bind = $mainMod SHIFT, T, exec, ~/.config/hypr/scripts/terminal-style.sh


# ══════════════════════════════════════════════════════════════════════
# CLIPBOARD — cliphist + Rofi
# ══════════════════════════════════════════════════════════════════════

bind = $mainMod, V, exec, cliphist list | rofi -dmenu -p "Clipboard" -theme ~/.config/rofi/themes/tokyo-night.rasi | cliphist decode | wl-copy


# ══════════════════════════════════════════════════════════════════════
# WINDOW MANAGEMENT
# ══════════════════════════════════════════════════════════════════════

bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, Space, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, S, layoutmsg, togglesplit
bind = $mainMod, G, togglegroup,
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b
bind = $mainMod, C, centerwindow,


# ══════════════════════════════════════════════════════════════════════
# ALT+TAB — Windows-style window switching
# ══════════════════════════════════════════════════════════════════════

bind = ALT, Tab, cyclenext,
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT, Tab, bringactivetotop,


# ══════════════════════════════════════════════════════════════════════
# FOCUS — Vim-style + Arrow keys
# ══════════════════════════════════════════════════════════════════════

bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d


# ══════════════════════════════════════════════════════════════════════
# MOVE WINDOWS — Vim-style + Arrow keys
# ══════════════════════════════════════════════════════════════════════

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d


# ══════════════════════════════════════════════════════════════════════
# RESIZE WINDOWS
# ══════════════════════════════════════════════════════════════════════

binde = $mainMod CTRL, H, resizeactive, -40 0
binde = $mainMod CTRL, L, resizeactive, 40 0
binde = $mainMod CTRL, K, resizeactive, 0 -40
binde = $mainMod CTRL, J, resizeactive, 0 40

binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40


# ══════════════════════════════════════════════════════════════════════
# WORKSPACES 1-10
# ══════════════════════════════════════════════════════════════════════

# Switch to workspace
bind = $mainMod, ampersand, workspace, 1
bind = $mainMod, eacute, workspace, 2
bind = $mainMod, quotedbl, workspace, 3
bind = $mainMod, apostrophe, workspace, 4
bind = $mainMod, parenleft, workspace, 5
bind = $mainMod, minus, workspace, 6
bind = $mainMod, egrave, workspace, 7
bind = $mainMod, underscore, workspace, 8
bind = $mainMod, ccedilla, workspace, 9
bind = $mainMod, agrave, workspace, 10

# Move active window to workspace
bind = $mainMod SHIFT, ampersand, movetoworkspace, 1
bind = $mainMod SHIFT, eacute, movetoworkspace, 2
bind = $mainMod SHIFT, quotedbl, movetoworkspace, 3
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4
bind = $mainMod SHIFT, parenleft, movetoworkspace, 5
bind = $mainMod SHIFT, minus, movetoworkspace, 6
bind = $mainMod SHIFT, egrave, movetoworkspace, 7
bind = $mainMod SHIFT, underscore, movetoworkspace, 8
bind = $mainMod SHIFT, ccedilla, movetoworkspace, 9
bind = $mainMod SHIFT, agrave, movetoworkspace, 10

# Move active window to workspace (silent — don't follow)
bind = $mainMod ALT, ampersand, movetoworkspacesilent, 1
bind = $mainMod ALT, eacute, movetoworkspacesilent, 2
bind = $mainMod ALT, quotedbl, movetoworkspacesilent, 3
bind = $mainMod ALT, apostrophe, movetoworkspacesilent, 4
bind = $mainMod ALT, parenleft, movetoworkspacesilent, 5
bind = $mainMod ALT, minus, movetoworkspacesilent, 6
bind = $mainMod ALT, egrave, movetoworkspacesilent, 7
bind = $mainMod ALT, underscore, movetoworkspacesilent, 8
bind = $mainMod ALT, ccedilla, movetoworkspacesilent, 9
bind = $mainMod ALT, agrave, movetoworkspacesilent, 10

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1


# ══════════════════════════════════════════════════════════════════════
# SPECIAL WORKSPACES (scratchpads)
# ══════════════════════════════════════════════════════════════════════

# Dropdown terminal (SUPER + `)
bind = $mainMod, grave, togglespecialworkspace, terminal
bind = $mainMod SHIFT, grave, movetoworkspace, special:terminal

# Music scratchpad (SUPER + M)
bind = $mainMod, M, togglespecialworkspace, music
bind = $mainMod SHIFT, M, movetoworkspace, special:music


# ══════════════════════════════════════════════════════════════════════
# MOUSE BINDS
# ══════════════════════════════════════════════════════════════════════

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# ══════════════════════════════════════════════════════════════════════
# MEDIA & HARDWARE KEYS
# ══════════════════════════════════════════════════════════════════════

# Volume — via volume script for OSD notifications
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume.sh up
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume.sh down
bindl  = , XF86AudioMute, exec, ~/.config/hypr/scripts/volume.sh mute
bindl  = , XF86AudioMicMute, exec, pamixer --default-source -t

# Brightness — via brightness script for OSD notifications
bindel = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness.sh up
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh down

# Media playback
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop


# ══════════════════════════════════════════════════════════════════════
# SCREENSHOTS — grim + slurp + swappy
# ══════════════════════════════════════════════════════════════════════

# Full screen
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh full

# Area selection -> swappy editor
bind = $mainMod, Print, exec, ~/.config/hypr/scripts/screenshot.sh area

# Active window only
bind = $mainMod SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh window

# Area selection -> clipboard only (quick)
bind = $mainMod ALT, Print, exec, ~/.config/hypr/scripts/screenshot.sh clip


# ══════════════════════════════════════════════════════════════════════
# SESSION — Lock, Logout, Reload
# ══════════════════════════════════════════════════════════════════════

# Lock screen
bind = $mainMod, X, exec, hyprlock

# Logout / power menu
bind = $mainMod SHIFT, X, exec, wlogout -b 4

# Reload Hyprland config
bind = $mainMod SHIFT, R, exec, hyprctl reload


# ══════════════════════════════════════════════════════════════════════
# COLOR PICKER
# ══════════════════════════════════════════════════════════════════════

bind = $mainMod SHIFT, C, exec, hyprpicker -a


# ══════════════════════════════════════════════════════════════════════
# HELP — Keybind Cheat Sheet
# ══════════════════════════════════════════════════════════════════════

bind = $mainMod, H, exec, ~/.config/hypr/scripts/keybinds.sh
