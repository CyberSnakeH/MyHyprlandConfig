# ╔══════════════════════════════════════════════════════════════════════╗
# ║   VISUAL DECORATIONS                                                ║
# ║   Tokyo Night Rice — Hyprland 0.51.1                                ║
# ║   Author: CyberSnake                                                      ║
# ║   Date:   2026-03-26                                                ║
# ║                                                                      ║
# ║   Maximum visual fidelity for RTX 5070 Ti. Heavy blur, deep         ║
# ║   shadows, and refined opacity create a premium frosted-glass       ║
# ║   desktop that rivals macOS Sequoia.                                ║
# ╚══════════════════════════════════════════════════════════════════════╝

decoration {
    # ─── Corner Rounding ────────────────────────────────────────────────
    # 12px rounds — consistent with Waybar/Rofi 12px border-radius
    rounding = 12

    # ─── Window Opacity ─────────────────────────────────────────────────
    # Active: fully opaque for sharp focus
    # Inactive: 88% creates clear visual hierarchy without losing readability
    # Fullscreen: always opaque (video, games, presentations)
    active_opacity = 1.0
    inactive_opacity = 0.88
    fullscreen_opacity = 1.0

    # ─── Blur ───────────────────────────────────────────────────────────
    # 4-pass Kawase blur at size 12 — RTX 5070 Ti handles this effortlessly.
    # This creates deep, rich frosted-glass that smooths background content
    # without turning it into a featureless smear.
    blur {
        enabled = true
        size = 12
        passes = 4
        xray = false

        # Fine-tuned frosted-glass parameters
        # noise:      subtle grain prevents banding on gradients
        # contrast:   slightly reduced to soften harsh background colors
        # brightness: dimmed to push background further back visually
        # vibrancy:   light color bleed for a warm, alive feeling
        noise = 0.01
        contrast = 0.9
        brightness = 0.8
        vibrancy = 0.2
        vibrancy_darkness = 0.5

        # Blur behind popups and layer surfaces (Rofi, SwayNC, menus)
        popups = true
        popups_ignorealpha = 0.2
    }

    # ─── Shadows ────────────────────────────────────────────────────────
    # Deep, soft shadows grounded in Tokyo Night's darkest tone.
    # range 30 + render_power 3 = wide diffuse shadow with soft falloff.
    # Offset (0, 4) pushes the shadow downward for a natural light-from-above feel.
    shadow {
        enabled = true
        range = 30
        render_power = 3
        offset = 0 4

        # Active:   80% opacity deep shadow for strong grounding
        # Inactive: 40% opacity — present but unobtrusive
        color = rgba(0d0e17cc)
        color_inactive = rgba(0d0e1766)
    }
}
