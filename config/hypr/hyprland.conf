# ║   Date:   2026-03-26                                                ║
# ║                                                                      ║
# ║   Main entry point — sources modular config files from conf.d/      ║
# ║   Edit individual files in conf.d/ rather than this file.           ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ─── Environment & Core Settings ─────────────────────────────────────
source = ~/.config/hypr/conf.d/environment.conf

# ─── Monitor Layout ──────────────────────────────────────────────────
source = ~/.config/hypr/conf.d/monitors.conf

# ─── Input Devices ───────────────────────────────────────────────────
source = ~/.config/hypr/conf.d/input.conf

# ─── Visual Decorations ─────────────────────────────────────────────
source = ~/.config/hypr/conf.d/decorations.conf

# ─── Animations & Bezier Curves ─────────────────────────────────────
source = ~/.config/hypr/conf.d/animations.conf

# ─── Window & Layer Rules ────────────────────────────────────────────
source = ~/.config/hypr/conf.d/rules.conf

# ─── Keybindings ─────────────────────────────────────────────────────
source = ~/.config/hypr/conf.d/keybinds.conf

# ─── Autostart Programs ─────────────────────────────────────────────
source = ~/.config/hypr/conf.d/autostart.conf
