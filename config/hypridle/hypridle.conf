# ============================================================================
# Hypridle Configuration -- Tokyo Night Rice
# Idle management: dim -> lock -> dpms off -> suspend
# Author: CyberSnake
# Date: 2026-03-26
# ============================================================================

# ---------------------------------------------------------------------------
# General -- lock/sleep integration
# ---------------------------------------------------------------------------
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# ---------------------------------------------------------------------------
# Stage 1: Dim screen after 5 minutes (300s)
# ---------------------------------------------------------------------------
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

# ---------------------------------------------------------------------------
# Stage 2: Lock session after 10 minutes (600s)
# ---------------------------------------------------------------------------
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# ---------------------------------------------------------------------------
# Stage 3: Turn off display after 15 minutes (900s)
# ---------------------------------------------------------------------------
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# ---------------------------------------------------------------------------
# Stage 4: Suspend system after 30 minutes (1800s)
# ---------------------------------------------------------------------------
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
