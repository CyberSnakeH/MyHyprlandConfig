# ============================================================================
# btop Configuration -- Tokyo Night Rice
# System monitor with custom Tokyo Night theme
# Author: CyberSnake
# Date: 2026-03-26
# ============================================================================

# Color theme -- references themes/tokyo-night.theme
color_theme = "tokyo-night"

# Truecolor support (24-bit)
truecolor = True

# Force TTY mode (disable for GPU rendering)
force_tty = False

# Graph symbol style: "braille", "block", or "tty"
graph_symbol = "braille"
graph_symbol_cpu = "default"
graph_symbol_mem = "default"
graph_symbol_net = "default"
graph_symbol_proc = "default"

# Boxes to display
shown_boxes = "cpu mem net proc"

# Update interval in milliseconds
update_ms = 2000

# Process sorting
proc_sorting = "cpu lazy"
proc_reversed = False
proc_tree = False
proc_colors = True
proc_gradient = True
proc_per_core = True
proc_mem_bytes = True
proc_cpu_graphs = True
proc_info_smaps = False
proc_left = False
proc_filter_kernel = False

# CPU settings
cpu_bottom = False
cpu_graph_upper = "total"
cpu_graph_lower = "total"
cpu_invert_lower = True
cpu_single_graph = False

# Memory settings
mem_graphs = True
mem_below_net = False
zfs_arc_cached = True
show_swap = True
swap_disk = True

# Network settings
net_download = 100
net_upload = 100
net_auto = True
net_sync = True
net_iface = ""

# Disk settings
show_disks = True
only_physical = True
use_fstab = True
zfs_hide_datasets = False
disk_free_priv = False
show_io_stat = True
io_mode = False
io_graph_combined = False
io_graph_speeds = ""

# Temperature
show_coretemp = True
cpu_core_map = ""
temp_scale = "celsius"

# Clock format
clock_format = "%H:%M"

# General UI
theme_background = True
rounded_corners = True
show_battery = True
selected_battery = "Auto"
show_init = True
log_level = "WARNING"
base_10_sizes = False
