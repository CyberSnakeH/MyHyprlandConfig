# ============================================================================
# Starship Prompt Configuration -- Tokyo Night Rice
# Two-line transient prompt with Nerd Font icons and Tokyo Night palette
# Author: CyberSnake
# Date: 2026-03-26
# ============================================================================

# Main format -- two-line prompt with fill separator
format = """
[](#7aa2f7)\
$os\
$username\
[](bg:#9274ca fg:#7aa2f7)\
$hostname\
[](bg:#394b70 fg:#9274ca)\
$directory\
[](bg:#394260 fg:#394b70)\
$git_branch\
$git_status\
$git_state\
[](bg:#1a1b26 fg:#394260)\
$python\
$rust\
$golang\
$nodejs\
$package\
$fill\
$cmd_duration\
$jobs\
$time\
$line_break\
$character"""

# Wait timeout for commands
command_timeout = 5000

# Palette reference
palette = "tokyo_night"

# ---------------------------------------------------------------------------
# Palette -- Tokyo Night colors
# ---------------------------------------------------------------------------
[palettes.tokyo_night]
rosewater = "#f7768e"
flamingo = "#f7768e"
pink = "#bb9af7"
mauve = "#bb9af7"
red = "#f7768e"
maroon = "#f7768e"
peach = "#ff9e64"
yellow = "#e0af68"
green = "#9ece6a"
teal = "#73daca"
sky = "#7dcfff"
sapphire = "#7aa2f7"
blue = "#7aa2f7"
lavender = "#bb9af7"
text = "#c0caf5"
subtext1 = "#a9b1d6"
subtext0 = "#9aa5ce"
overlay2 = "#787c99"
overlay1 = "#565f89"
overlay0 = "#545c7e"
surface2 = "#3b4261"
surface1 = "#394b70"
surface0 = "#394260"
base = "#1a1b26"
mantle = "#16161e"
crust = "#13131a"

# ---------------------------------------------------------------------------
# OS icon
# ---------------------------------------------------------------------------
[os]
disabled = false
style = "bg:#7aa2f7 fg:#1a1b26"

[os.symbols]
Fedora = " "
Linux = " "
Macos = " "
Windows = "󰍲 "
Ubuntu = " "
Arch = "󰣇 "
Debian = " "

# ---------------------------------------------------------------------------
# Username
# ---------------------------------------------------------------------------
[username]
show_always = true
style_user = "bg:#7aa2f7 fg:#1a1b26 bold"
style_root = "bg:#f7768e fg:#1a1b26 bold"
format = "[ $user ]($style)"

# ---------------------------------------------------------------------------
# Hostname
# ---------------------------------------------------------------------------
[hostname]
ssh_only = false
style = "bg:#9274ca fg:#1a1b26"
format = "[ $ssh_symbol$hostname ]($style)"
ssh_symbol = "󰣀 "

# ---------------------------------------------------------------------------
# Directory
# ---------------------------------------------------------------------------
[directory]
style = "bg:#394b70 fg:#c0caf5"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = ".../"
home_symbol = " ~"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Videos" = "󰕧 "
"Projects" = "󰲋 "
".config" = " "

# ---------------------------------------------------------------------------
# Git branch
# ---------------------------------------------------------------------------
[git_branch]
symbol = " "
style = "bg:#394260 fg:#c0caf5"
format = "[ $symbol$branch ]($style)"
truncation_length = 20
truncation_symbol = "..."

# ---------------------------------------------------------------------------
# Git status
# ---------------------------------------------------------------------------
[git_status]
style = "bg:#394260 fg:#e0af68"
format = "[$all_status$ahead_behind]($style)"
conflicted = " "
ahead = " ${count} "
behind = " ${count} "
diverged = "  ${ahead_count}  ${behind_count} "
untracked = " ${count} "
stashed = "  ${count} "
modified = " ${count} "
staged = " ${count} "
renamed = "󰑕 ${count} "
deleted = " ${count} "

# ---------------------------------------------------------------------------
# Git state (rebase, merge, etc.)
# ---------------------------------------------------------------------------
[git_state]
style = "bg:#394260 fg:#f7768e"
format = "[$state( $progress_current/$progress_total)]($style) "
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"

# ---------------------------------------------------------------------------
# Language modules
# ---------------------------------------------------------------------------
[python]
symbol = " "
style = "bg:#1a1b26 fg:#e0af68"
format = "[ $symbol($version )(\\($virtualenv\\) )]($style)"
detect_extensions = ["py"]
detect_files = ["requirements.txt", "pyproject.toml", "Pipfile", "setup.py"]

[rust]
symbol = " "
style = "bg:#1a1b26 fg:#f7768e"
format = "[ $symbol($version )]($style)"
detect_extensions = ["rs"]

[golang]
symbol = " "
style = "bg:#1a1b26 fg:#7dcfff"
format = "[ $symbol($version )]($style)"
detect_extensions = ["go"]
detect_files = ["go.mod"]

[nodejs]
symbol = " "
style = "bg:#1a1b26 fg:#9ece6a"
format = "[ $symbol($version )]($style)"
detect_extensions = ["js", "ts", "mjs"]
detect_files = ["package.json", ".node-version"]

[package]
symbol = "󰏗 "
style = "bg:#1a1b26 fg:#ff9e64"
format = "[ $symbol($version )]($style)"
display_private = false

# ---------------------------------------------------------------------------
# Fill -- stretches to separate left/right
# ---------------------------------------------------------------------------
[fill]
symbol = " "

# ---------------------------------------------------------------------------
# Command duration
# ---------------------------------------------------------------------------
[cmd_duration]
min_time = 2_000
style = "fg:#545c7e"
format = "[ $duration ]($style)"
show_milliseconds = false
show_notifications = false

# ---------------------------------------------------------------------------
# Background jobs
# ---------------------------------------------------------------------------
[jobs]
symbol = "  "
style = "fg:#e0af68"
number_threshold = 1
format = "[$symbol$number]($style) "

# ---------------------------------------------------------------------------
# Time
# ---------------------------------------------------------------------------
[time]
disabled = false
time_format = "%H:%M"
style = "fg:#7aa2f7"
format = "[  $time ]($style)"

# ---------------------------------------------------------------------------
# Prompt character
# ---------------------------------------------------------------------------
[character]
success_symbol = "[](bold fg:#9ece6a)"
error_symbol = "[](bold fg:#f7768e)"
vimcmd_symbol = "[](bold fg:#7aa2f7)"

# ---------------------------------------------------------------------------
# Line break
# ---------------------------------------------------------------------------
[line_break]
disabled = false
