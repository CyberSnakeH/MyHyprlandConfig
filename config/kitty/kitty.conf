# ============================================================================
# Kitty Terminal Configuration -- Base (behavior, keybinds, performance)
# Visual settings (colors, font size, cursor, padding) live in kitty-style.conf
# Author: CyberSnake
# Date: 2026-03-26
# ============================================================================

# ---------------------------------------------------------------------------
# Remote control (required for theme/style switching)
# ---------------------------------------------------------------------------
allow_remote_control yes
listen_on unix:/tmp/kitty-socket

# ---------------------------------------------------------------------------
# Font family (size is set per-style in kitty-style.conf)
# ---------------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
disable_ligatures never

# ---------------------------------------------------------------------------
# Scrollback
# ---------------------------------------------------------------------------
scrollback_lines 12000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ---------------------------------------------------------------------------
# Performance
# ---------------------------------------------------------------------------
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# ---------------------------------------------------------------------------
# Audio
# ---------------------------------------------------------------------------
enable_audio_bell no
visual_bell_duration 0.0

# ---------------------------------------------------------------------------
# Window behavior (geometry, borders -- colors set per-style)
# ---------------------------------------------------------------------------
initial_window_width  1100
initial_window_height 680
draw_minimal_borders  yes
window_border_width   1pt
active_border_color   #7aa2f7
inactive_border_color #292e42
bell_border_color     #e0af68
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.95

# ---------------------------------------------------------------------------
# Tab bar behavior (colors set per-style)
# ---------------------------------------------------------------------------
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted
tab_bar_min_tabs    2
active_tab_font_style   bold
inactive_tab_font_style normal
tab_bar_margin_width    0.0
tab_bar_margin_height   0.0 0.0

# ---------------------------------------------------------------------------
# URL detection
# ---------------------------------------------------------------------------
url_style curly
detect_urls yes

# ---------------------------------------------------------------------------
# Marks
# ---------------------------------------------------------------------------
mark1_foreground #1a1b26
mark1_background #7aa2f7
mark2_foreground #1a1b26
mark2_background #9ece6a
mark3_foreground #1a1b26
mark3_background #e0af68

# ---------------------------------------------------------------------------
# Keybindings
# ---------------------------------------------------------------------------

# Tabs
map ctrl+shift+t     new_tab
map ctrl+shift+w     close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+.     move_tab_forward
map ctrl+shift+,     move_tab_backward
map ctrl+alt+1       goto_tab 1
map ctrl+alt+2       goto_tab 2
map ctrl+alt+3       goto_tab 3
map ctrl+alt+4       goto_tab 4
map ctrl+alt+5       goto_tab 5

# Windows / splits
map ctrl+shift+enter new_window
map ctrl+shift+n     new_os_window
map ctrl+shift+]     next_window
map ctrl+shift+[     previous_window

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Font size
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0

# Scrollback
map ctrl+shift+k     scroll_line_up
map ctrl+shift+j     scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home  scroll_home
map ctrl+shift+end   scroll_end
map ctrl+shift+h     show_scrollback

# Layout
map ctrl+shift+l next_layout

# Misc
map ctrl+shift+f5    load_config_file
map ctrl+shift+f2    edit_config_file
map ctrl+shift+u     kitten unicode_input

# ---------------------------------------------------------------------------
# Style include -- ALL visual settings (colors, font_size, padding, cursor)
# This file is swapped by the terminal-style.sh switcher
# ---------------------------------------------------------------------------
include kitty-style.conf
