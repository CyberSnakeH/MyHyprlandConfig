# Style: Retro -- amber CRT monitor feel
# Monochromatic amber on black, like a vintage terminal
# ============================================================================

font_size 14
window_padding_width 24
cursor_shape block
cursor_blink_interval 0.6

background #0c0c0c
foreground #ccaa44
cursor #ccaa44
cursor_text_color #0c0c0c
selection_background #332a10
selection_foreground #ccaa44
url_color #ddbb55

# Black
color0  #0c0c0c
color8  #332a10

# Red
color1  #aa4422
color9  #aa4422

# Green
color2  #886622
color10 #886622

# Yellow
color3  #ccaa44
color11 #ccaa44

# Blue
color4  #775533
color12 #775533

# Magenta
color5  #996644
color13 #996644

# Cyan
color6  #aa8833
color14 #aa8833

# White
color7  #ccaa44
color15 #eedd88

# Tab bar colors
active_tab_foreground   #0c0c0c
active_tab_background   #ccaa44
inactive_tab_foreground #665522
inactive_tab_background #1a1500
tab_bar_background      #0c0c0c
