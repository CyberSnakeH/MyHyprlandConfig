# Style: Minimal -- clean, monochrome, distraction-free
# Near-grayscale with subtle color accents, generous padding
# ============================================================================

font_size 13
window_padding_width 28
cursor_shape beam
cursor_blink_interval 0

background #171717
foreground #d0d0d0
cursor #d0d0d0
cursor_text_color #171717
selection_background #333333
selection_foreground #ffffff
url_color #8888cc

# Black
color0  #171717
color8  #404040

# Red
color1  #b06060
color9  #b06060

# Green
color2  #70a070
color10 #70a070

# Yellow
color3  #b0a060
color11 #b0a060

# Blue
color4  #6080b0
color12 #6080b0

# Magenta
color5  #a070a0
color13 #a070a0

# Cyan
color6  #60a0a0
color14 #60a0a0

# White
color7  #b0b0b0
color15 #d0d0d0

# Tab bar colors
active_tab_foreground   #171717
active_tab_background   #d0d0d0
inactive_tab_foreground #606060
inactive_tab_background #222222
tab_bar_background      #171717
